
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobNest - Login & Register</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">JobNest.</a>
        <a href="index.html" class="home-link">Back to Home</a>
    </header>

    <main class="auth-container">
        <section class="welcome">
            <h1>Find Your Dream Job!</h1>
            <p>Discover opportunities, connect with companies
               and take the next step in your career.</p>
            <div class="welcome-icon">✦</div>
        </section>

        <section class="auth-card">
            <div class="tabs">
                <button id="loginTab" class="active"
                    type="button">Login</button>
                <button id="registerTab"
                    type="button">Register</button>
            </div>

            <h2 id="formTitle">Welcome Back!</h2>
            <p class="subtitle" id="formSubtitle">
                Login to continue to JobNest
            </p>

            <form id="authForm">

                <div class="field" id="nameField" hidden>
                    <label for="name">Full Name</label>
                    <input type="text" id="name"
                        placeholder="Enter your full name">
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                        placeholder="Enter your password"
                        minlength="6" required>
                </div>

                <div class="field" id="roleField" hidden>
                    <label for="role">Select Account Type</label>
                    <select id="role">
                        <option value="Job Seeker">Job Seeker</option>
                        <option value="Employer">Employer</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn"
                    id="submitBtn">Login</button>

            </form>

            <p class="switch-text" id="switchText">
                Don't have an account?
                <button type="button" id="switchButton">
                    Register
                </button>
            </p>

            <p id="message" role="status"></p>
        </section>
    </main>

    <script src="auth.js"></script>
</body>
</html>
